name: Build finalpool

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-finalpool:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch task manifest
        run: git fetch origin finalpool && git show FETCH_HEAD:finalpool_manifest.json > /tmp/finalpool_manifest.json
      - name: Build and push finalpool
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C finalpool origin/main
          git rm -f --ignore-unmatch .github/workflows/build-finalpool.yml finalpool_manifest.json
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          manifest = json.loads(pathlib.Path('/tmp/finalpool_manifest.json').read_text())
          for branch in sorted({branch for branch, _ in manifest.values()}):
              subprocess.run(['git', 'fetch', 'origin', f'refs/heads/{branch}:refs/remotes/origin/{branch}'], check=True)
          for name, (branch, source) in manifest.items():
              target = pathlib.Path('tasks/finalpool') / name
              target.mkdir(parents=True, exist_ok=True)
              archive = subprocess.check_output(['git', 'archive', f'origin/{branch}', source])
              subprocess.run(['tar', '-x', '-C', str(target), '--strip-components=3'], input=archive, check=True)
              print(f'Copied {name} from {branch}:{source}')
          print(f'Prepared {len(manifest)} tasks')
          PY
          git add tasks/finalpool
          git diff --cached --quiet || git commit -m "Add implemented tasks from Notion Task Tracker"
          git push --force origin finalpool